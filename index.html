<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Timeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20261107b" />
</head>
<body>
  <div class="netbar" id="netbar" hidden>You’re offline. Timeline will refresh when you reconnect.</div>
  <div class="app">
    <section class="route" id="route-timeline">
      <header class="appbar" id="timeline-appbar">
        <div class="shellbar">
          <div class="shellbar__inner">
            <button type="button" class="icon-btn" id="menu-btn" aria-label="Main menu" data-icon="menu"></button>
            <h1 class="shellbar__title">Timeline</h1>
            <span class="spacer"></span>
            <button type="button" class="icon-btn" id="global-search-btn" aria-label="Search Gainsight" data-icon="search"></button>
            <span class="shellbar__avatar" id="me-avatar"></span>
          </div>
        </div>
        <div class="appbar__row">
          <button type="button" class="view-switch" id="view-switch" aria-haspopup="dialog">
            <span id="view-label">Default View</span>
            <span class="view-switch__chev" data-icon="chevronDown"></span>
          </button>
          <div class="appbar__actions">
            <button type="button" class="icon-btn hide-sm" id="refresh-btn" aria-label="Refresh" data-icon="refresh"></button>
            <button type="button" class="drafts-btn" id="drafts-btn" aria-label="Drafts">
              <span class="drafts-btn__label">Drafts</span>
              <span class="drafts-btn__count" id="drafts-count">0</span>
            </button>
            <button type="button" class="btn btn--primary hide-sm" id="add-btn">Add Activity</button>
          </div>
        </div>

        <div class="toolbar">
          <div class="search" id="search">
            <button type="button" class="search__scope" id="scope-btn" aria-haspopup="dialog">
              <span id="scope-label">Content</span>
              <span data-icon="chevronDown"></span>
            </button>
            <div class="search__field">
              <span class="search__icon" data-icon="search"></span>
              <div id="search-token-slot" class="search__token-slot"></div>
              <input id="search-input" type="search" autocomplete="off" enterkeyhint="search"
                     aria-autocomplete="list" aria-controls="search-results" placeholder="Search subjects and notes" />
              <button type="button" class="search__clear" id="search-clear" aria-label="Clear search" hidden data-icon="x"></button>
            </div>
            <div class="search__results" id="search-results" role="listbox" hidden></div>
          </div>
          <button type="button" class="chip chip--advanced hide-sm" id="advanced-btn">Advanced Filters<span class="chip__count" id="advanced-count" hidden>0</span></button>
          <div class="chips" id="chips"></div>
        </div>
      </header>

      <main class="feed" id="feed" aria-live="polite"></main>

      <button type="button" class="fab show-sm" id="fab">Add Activity</button>
    </section>

    <section class="route" id="route-drafts" hidden>
      <header class="appbar" id="drafts-appbar">
        <div class="appbar__row">
          <div class="appbar__title appbar__title--inline">
            <button type="button" class="icon-btn" id="drafts-back" aria-label="Back to Timeline" data-icon="chevronLeft"></button>
            <h1>Drafts <span class="muted" id="drafts-total"></span></h1>
          </div>
          <div class="appbar__actions">
            <button type="button" class="btn btn--ghost" id="drafts-select-toggle">Select</button>
          </div>
        </div>
        <div class="toolbar">
          <div class="search search--plain">
            <div class="search__field">
              <span class="search__icon" data-icon="search"></span>
              <input id="drafts-search" type="text" autocomplete="off" placeholder="Search drafts" />
            </div>
          </div>
          <div class="segmented" id="drafts-seg" role="tablist">
            <button type="button" role="tab" data-seg="all" class="is-active">All drafts</button>
            <button type="button" role="tab" data-seg="email">Email &amp; plugin</button>
          </div>
        </div>
      </header>

      <main class="feed" id="drafts-list"></main>

      <div class="actionbar" id="drafts-actionbar" hidden>
        <button type="button" class="btn btn--ghost" id="drafts-select-all">Select all</button>
        <span class="actionbar__count" id="drafts-selected-count">0 selected</span>
        <button type="button" class="btn btn--danger" id="drafts-delete" disabled>
          <span data-icon="trash"></span> Delete
        </button>
      </div>
    </section>
  </div>

  <div id="picker-root"></div>
  <div id="panel-root"></div>
  <div id="sheet-root"></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="icons.js"></script>
  <script src="app.js?v=20261107b"></script>
</body>
</html>
